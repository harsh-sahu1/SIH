<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kisan Setu — Escrow Environment Verification</title>

  <!-- Modern typography: Inter font family for trust and high security aesthetics -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       CSS RESET & DESIGN TOKENS
       ========================================================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Extracted dominant colors from Kisan Setu logo */
      --glow-saffron: #f97803;        /* Extracted dominant vibrant saffron */
      --glow-deep-amber: #e85206;     /* Extracted warm amber tone */
      --glow-emerald: #1b7128;        /* Complementary agriculture green */

      /* Dark immersive background tones */
      --bg-dark-base: #060913;        /* Deep charcoal / pitch black base */
      --bg-navy-core: #0c1427;        /* Rich dark navy core gradient */
      --bg-navy-elevated: #111c35;

      /* Typography & Accents */
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --border-subtle: rgba(249, 120, 3, 0.18);
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark-base);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      color: var(--text-main);
    }

    /* ==========================================================================
       FULL-SCREEN LOADING OVERLAY (FLEXBOX CENTERED)
       ========================================================================== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, var(--bg-navy-core) 0%, var(--bg-dark-base) 70%, #030509 100%);
      transition: opacity 800ms cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 800ms cubic-bezier(0.4, 0, 0.2, 1);
      opacity: 1;
      visibility: visible;
      user-select: none;
    }

    /* State applied by JavaScript once authentication completes */
    #loadingOverlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Decorative ambient glow sphere behind logo */
    .ambient-glow {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249, 120, 3, 0.15) 0%, rgba(232, 82, 6, 0.05) 50%, transparent 70%);
      pointer-events: none;
      animation: ambientPulse 4s ease-in-out infinite;
    }

    /* ==========================================================================
       LOGO CONTAINER & BREATHING GLOW ANIMATION (NO ROTATION)
       ========================================================================== */
    .logo-container {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0;
    }

    .loading-logo {
      width: clamp(140px, 22vw, 210px);
      height: clamp(140px, 22vw, 210px);
      border-radius: 50%;
      object-fit: cover;
      display: block;
      /* Smooth continuous breathing animation using filter: drop-shadow and transform: scale */
      animation: glowingPulse 3.2s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
      will-change: transform, filter;
    }

    /* Keyframes: Breathing pulse and dynamic saffron glow emission without rotating */
    @keyframes glowingPulse {
      0% {
        transform: scale(0.96);
        filter: drop-shadow(0 0 16px rgba(249, 120, 3, 0.45))
                drop-shadow(0 0 32px rgba(232, 82, 6, 0.25));
      }
      50% {
        transform: scale(1.04);
        filter: drop-shadow(0 0 38px rgba(249, 120, 3, 0.95))
                drop-shadow(0 0 75px rgba(249, 120, 3, 0.55))
                drop-shadow(0 0 110px rgba(232, 82, 6, 0.35));
      }
      100% {
        transform: scale(0.96);
        filter: drop-shadow(0 0 16px rgba(249, 120, 3, 0.45))
                drop-shadow(0 0 32px rgba(232, 82, 6, 0.25));
      }
    }

    @keyframes ambientPulse {
      0%, 100% { transform: scale(0.85); opacity: 0.6; }
      50% { transform: scale(1.15); opacity: 1; }
    }

    /* ==========================================================================
       STATS & IMPACT CAPTIONS (BELOW LOGO)
       ========================================================================== */
    .stats-container {
      position: relative;
      z-index: 2;
      text-align: center;
      margin-top: 24px;
      padding: 0 20px;
      max-width: 640px;
      animation: fadeInStats 1.2s ease-out forwards;
    }

    .stats-headline {
      font-size: clamp(16px, 2.2vw, 20.5px);
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f8fafc;
      line-height: 1.4;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.65);
    }

    .stats-headline .highlight-metric {
      color: var(--glow-saffron);
      font-weight: 700;
      text-shadow: 0 0 24px rgba(249, 120, 3, 0.45);
    }

    .stats-subtext {
      font-size: clamp(12.5px, 1.5vw, 13.5px);
      font-weight: 400;
      color: var(--text-muted);
      margin-top: 8px;
      letter-spacing: 0.015em;
      line-height: 1.5;
      opacity: 0.85;
    }

    @keyframes fadeInStats {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ==========================================================================
       UNDERLYING APPLICATION CONTAINER (REVEALED BENEATH OVERLAY)
       ========================================================================== */
    #mainAppContent {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #0f172a;
      color: #f8fafc;
      padding: 24px;
    }

    .app-welcome-card {
      max-width: 480px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 32px 28px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .app-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .app-title span {
      color: var(--glow-saffron);
    }

    .app-subtitle {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .app-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--glow-saffron);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.2s ease;
      box-shadow: 0 4px 14px rgba(249, 120, 3, 0.35);
    }

    .app-btn:hover {
      background: var(--glow-deep-amber);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <!-- ========================================================================
       FULL-SCREEN RESPONSIVE LOADING OVERLAY
       ======================================================================== -->
  <aside id="loadingOverlay" role="status" aria-live="polite" aria-label="Loading verification screen">
    <!-- Ambient glowing sphere -->
    <div class="ambient-glow" aria-hidden="true"></div>

    <!-- Centered Logo with continuous glowing pulse animation -->
    <div class="logo-container">
      <img
        src="kisan_setu_logo.png"
        alt="Kisan Setu Escrow & Procurement Authentication"
        class="loading-logo"
        onerror="this.onerror=null; this.src='kisan_setu_logo.jpg';"
      />
    </div>

    <!-- National Impact Metric & Subtitle -->
    <div class="stats-container">
      <div class="stats-headline">
        <span class="highlight-metric">10.31 Crore+</span> Farmer IDs created across India
      </div>
      <p class="stats-subtext">Supporting India's growing digital agriculture ecosystem</p>
    </div>

  </aside>

  <!-- ========================================================================
       MAIN APPLICATION (REVEALED AFTER OVERLAY FADES OUT)
       ======================================================================== -->
  <main id="mainAppContent" aria-hidden="true">
    <div class="app-welcome-card">
      <h1 class="app-title">Kisan <span>Setu</span></h1>
      <p class="app-subtitle">
        Escrow environment successfully authenticated. Proceed to the National Farmer Procurement & Virtual Queue Portal.
      </p>
      <a href="index.html" class="app-btn" id="enterDashboardBtn">
        Enter Mandi Portal →
      </a>
    </div>
  </main>

  <!-- ========================================================================
       VANILLA JAVASCRIPT TRANSITION LOGIC
       ======================================================================== -->
  <script>
    /**
     * Kisan Setu Escrow Loading Screen Controller
     * Listens for the window 'load' event, waits an additional 2000ms to simulate
     * secure backend verification, then smoothly fades out the overlay (800ms)
     * to reveal the main application beneath it.
     */
    (function () {
      'use strict';

      const SIMULATED_VERIFICATION_DELAY_MS = 2500;
      const FADE_DURATION_MS = 800;

      /**
       * Fades out the loading overlay and transitions to the main application
       */
      function completeEscrowAuthentication() {
        const overlay = document.getElementById('loadingOverlay');
        const mainContent = document.getElementById('mainAppContent');

        if (!overlay) return;

        // Wait the required 2 seconds to simulate backend verification
        setTimeout(() => {
          // Trigger smooth CSS fade-out (opacity: 0 over 800ms, visibility: hidden)
          overlay.classList.add('fade-out');

          if (mainContent) {
            mainContent.removeAttribute('aria-hidden');
          }

          // Once overlay transition completes, transition directly into the application
          setTimeout(() => {
            // If query params specify a target or user prefers direct seamless navigation
            const urlParams = new URLSearchParams(window.location.search);
            const targetUrl = urlParams.get('redirect') || 'index.html';
            window.location.href = targetUrl;
          }, FADE_DURATION_MS);

        }, SIMULATED_VERIFICATION_DELAY_MS);
      }

      // Requirement 4: Listen for window load event
      if (document.readyState === 'complete') {
        completeEscrowAuthentication();
      } else {
        window.addEventListener('load', completeEscrowAuthentication, { once: true });
      }
    })();
  </script>

</body>
</html>
